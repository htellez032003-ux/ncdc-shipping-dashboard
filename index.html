<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCDC Shipping Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md text-center w-96">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">NCDC Shipping Dashboard</h1>
    <input id="loginEmail" type="email" placeholder="Email" class="border p-2 rounded w-full mb-2">
    <input id="loginPassword" type="password" placeholder="Password" class="border p-2 rounded w-full mb-4">
    <button onclick="login()" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded w-full">Login</button>
    <p id="errorMsg" class="text-red-500 hidden mt-2">Invalid credentials</p>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
