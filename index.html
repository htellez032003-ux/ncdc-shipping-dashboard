<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NCDC Shipping Dashboard – Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <!-- NCDC logo placeholder -->
        <div class="logo-circle">N</div>
        <div>
          <h1 class="app-title">NCDC Shipping Dashboard</h1>
          <p class="app-subtitle">Internal Scheduling & Dock Control</p>
        </div>
      </div>
      <form id="loginForm" class="login-form">
        <label class="form-label" for="loginEmail">Email</label>
        <input id="loginEmail" type="email" class="form-input" placeholder="you@example.com" required />

        <label class="form-label" for="loginPassword">Password</label>
        <input id="loginPassword" type="password" class="form-input" placeholder="••••••••" required />

        <button type="submit" class="btn-primary w-full">Sign In</button>
        <p id="loginError" class="form-error hidden">Invalid credentials.</p>
      </form>
      <p class="login-hint">
        Owner login (current): <strong>htellez032003@gmail.com</strong> / <strong>Ltapparel040523</strong>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
