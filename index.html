
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCDC Shipping Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1 class="app-title">NCDC Shipping Dashboard</h1>
      <p class="muted">Owner / Admin sign in</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email" required />
        <label>Password</label>
        <input type="password" id="login-password" placeholder="password" required />
        <button type="submit" class="primary-btn">Log In</button>
      </form>
      <p id="login-error" class="error-msg"></p>
      <p class="muted small">
        (Use <strong>htellez032003@gmail.com</strong> / <strong>Ltapparel040523</strong>)
      </p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <h2>NCDC Shipping Dashboard</h2>
      <button id="logout-btn" class="ghost-btn">Log out</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="orders">Orders</button>
      <button class="tab-btn" data-tab="dock">Dock</button>
      <button class="tab-btn" data-tab="truckloads">Truckloads</button>
      <button class="tab-btn" data-tab="metrics">Metrics</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <main class="panels">
      <section id="tab-orders" class="tab-panel active"></section>
      <section id="tab-dock" class="tab-panel"></section>
      <section id="tab-truckloads" class="tab-panel"></section>
      <section id="tab-metrics" class="tab-panel"></section>
      <section id="tab-settings" class="tab-panel"></section>
    </main>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
